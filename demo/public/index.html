<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050705">
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png">
  <title>Prompt Prism Agent Demo</title>
  <style>
    :root{color-scheme:dark;--bg:#050705;--panel:#080c09;--surface:#0b110d;--line:#193021;--line-strong:#285138;--text:#f4f7f5;--muted:#93a49a;--green:#00bd49;--green-soft:rgba(0,189,73,.13);--red:#ff2600;--red-soft:rgba(255,38,0,.12)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:15px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(860px,calc(100% - 32px));margin:36px auto}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:14px}
    .brand img{display:block;width:54px;height:54px;object-fit:contain}
    h1{margin:0 0 4px;font-size:23px;font-weight:600;letter-spacing:-.02em}
    .subtitle,.hint{color:var(--muted)}
    .subtitle{font-size:12px}
    .live{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
    .live::before{content:"";width:7px;height:7px;background:var(--green);box-shadow:0 0 0 4px rgba(0,189,73,.09)}
    .panel{background:var(--panel);border:1px solid var(--line);overflow:hidden}
    .messages{height:min(58vh,540px);min-height:340px;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px}
    .bubble{max-width:78%;padding:11px 14px;border:1px solid var(--line);white-space:pre-wrap;line-height:1.55}
    .bubble.user{align-self:flex-end;background:var(--green-soft);border-color:rgba(0,189,73,.38)}
    .bubble.assistant{align-self:flex-start;background:var(--surface)}
    .composer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0;border-top:1px solid var(--line)}
    textarea{min-height:58px;max-height:160px;resize:vertical;background:#060906;color:var(--text);border:0;border-right:1px solid var(--line);padding:16px;font:inherit;outline:none}
    textarea:focus{box-shadow:inset 3px 0 0 var(--green)}
    button{min-width:112px;border:0;background:var(--green);color:#001b09;padding:10px 18px;cursor:pointer;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
    button:hover{background:#16d45d}
    button:focus-visible{outline:2px solid #fff;outline-offset:-4px}
    button:disabled{opacity:.45;cursor:not-allowed}
    .status{min-height:29px;font-size:12px;color:var(--muted);padding:8px 14px 10px;border-top:1px solid var(--line)}
    .error{color:var(--red)}
    .hint{margin:14px 0 0;font-size:11px;line-height:1.6}
    @media(max-width:650px){main{width:100%;margin:0}.brand img{width:44px;height:44px}header{padding:14px 16px;margin:0}.live{display:none}.panel{border-left:0;border-right:0}.messages{height:55vh;min-height:300px;padding:14px}.bubble{max-width:90%}.composer{grid-template-columns:1fr}.composer textarea{border-right:0;border-bottom:1px solid var(--line)}button{min-height:48px}.hint{padding:0 14px 14px}}
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <img src="/brand/logo-mark.png" alt="" width="54" height="54">
        <div><h1>Prompt Prism Agent Demo</h1><div class="subtitle">Model traffic flows through local Prompt Prism.</div></div>
      </div>
      <div class="live">Agent online</div>
    </header>
    <section class="panel">
      <div class="messages" id="messages"><div class="bubble assistant">Hi! I’m the demo agent. Ask me something, then continue the conversation to create a cacheable prefix.</div></div>
      <form class="composer" id="composer"><textarea id="input" required placeholder="Message the agent…"></textarea><button id="send">Send</button></form>
      <div class="status" id="status"></div>
    </section>
    <p class="hint">The Demo knows only Prism’s Base URL; Prism owns the real provider address.</p>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
