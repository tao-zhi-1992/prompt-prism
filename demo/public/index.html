<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prompt Prism Demo</title>
  <style>
    :root{color-scheme:dark;--bg:#090d14;--panel:#141b26;--line:#263247;--text:#e6edf3;--muted:#8b9bb0;--accent:#a78bfa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#191432 0,transparent 36%),var(--bg);color:var(--text);font:15px Inter,ui-sans-serif,system-ui}main{width:min(820px,calc(100% - 32px));margin:42px auto}header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px}h1{margin:0;font-size:27px}.subtitle,.hint{color:var(--muted)}a{color:#c4b5fd}.panel{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:14px;overflow:hidden}.messages{height:min(58vh,520px);min-height:340px;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}.bubble{max-width:78%;padding:11px 14px;border-radius:14px;white-space:pre-wrap;line-height:1.55}.bubble.user{align-self:flex-end;background:#44327a}.bubble.assistant{align-self:flex-start;background:#1d2838}.composer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}textarea{flex:1;min-height:48px;max-height:150px;resize:vertical;background:#0e141e;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}button{border:1px solid var(--accent);background:var(--accent);color:#130b29;border-radius:9px;padding:10px 18px;cursor:pointer;font-weight:700}button:disabled{opacity:.5}.status{font-size:13px;color:var(--muted);padding:0 16px 12px}.error{color:#fb7185}@media(max-width:650px){header{display:block}header a{display:inline-block;margin-top:12px}.bubble{max-width:90%}}
  </style>
</head>
<body><main><header><div><h1>Prompt Prism Agent Demo</h1><div class="subtitle">A normal chat agent whose model traffic flows through local Prompt Prism.</div></div></header><section class="panel"><div class="messages" id="messages"><div class="bubble assistant">Hi! I’m the demo agent. Ask me something, then continue the conversation to create a cacheable prefix.</div></div><form class="composer" id="composer"><textarea id="input" required placeholder="Message the agent…"></textarea><button id="send">Send</button></form><div class="status" id="status"></div></section><p class="hint">The Demo knows only Prism’s Base URL; Prism owns the real provider address.</p></main><script type="module" src="/app.js"></script></body>
</html>
