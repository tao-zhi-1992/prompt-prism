name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing package version to publish (for example, 0.3.0)'
        required: true
        default: '0.3.0'
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: ${{ github.event_name == 'push' }}
    name: Create release and publish
    runs-on: ubuntu-latest
    steps:
      - name: Create release pull request or release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out release commit
        if: ${{ steps.release.outputs['packages/prompt-prism--release_created'] == 'true' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs['packages/prompt-prism--sha'] }}

      - name: Set up pnpm
        if: ${{ steps.release.outputs['packages/prompt-prism--release_created'] == 'true' }}
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        if: ${{ steps.release.outputs['packages/prompt-prism--release_created'] == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
          always-auth: true

      - name: Install dependencies
        if: ${{ steps.release.outputs['packages/prompt-prism--release_created'] == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Run checks before publishing
        if: ${{ steps.release.outputs['packages/prompt-prism--release_created'] == 'true' }}
        run: pnpm test

      - name: Publish package to npm
        if: ${{ steps.release.outputs['packages/prompt-prism--release_created'] == 'true' }}
        working-directory: packages/prompt-prism
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  publish-existing:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Publish an existing release
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
          always-auth: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$(node -p "require('./packages/prompt-prism/package.json').version")" = "$RELEASE_VERSION"

      - name: Run checks before publishing
        run: pnpm test

      - name: Publish package to npm
        working-directory: packages/prompt-prism
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
