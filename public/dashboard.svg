<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Prompt Prism dashboard</title>
  <desc id="desc">A dark dashboard listing prompt-cache captures and a red and green character diff.</desc>
  <rect width="1200" height="630" rx="18" fill="#0c1017"/>
  <circle cx="28" cy="25" r="6" fill="#f85149"/><circle cx="48" cy="25" r="6" fill="#d29922"/><circle cx="68" cy="25" r="6" fill="#3fb950"/>
  <text x="55" y="96" fill="#e6edf3" font-family="ui-monospace,monospace" font-size="27" font-weight="700">Prompt Prism</text>
  <text x="55" y="124" fill="#8d9bad" font-family="ui-monospace,monospace" font-size="14">See exactly where your prompt cache breaks.</text>
  <rect x="55" y="157" width="1090" height="210" rx="10" fill="#151b25" stroke="#263041"/>
  <g fill="#8d9bad" font-family="ui-monospace,monospace" font-size="13"><text x="78" y="190">TIME</text><text x="294" y="190">MODEL</text><text x="535" y="190">TOKEN</text><text x="695" y="190">INPUT</text><text x="810" y="190">CACHE READ</text><text x="1010" y="190">RESULT</text></g>
  <path d="M55 207h1090M55 275h1090" stroke="#263041"/>
  <g fill="#e6edf3" font-family="ui-monospace,monospace" font-size="14"><text x="78" y="246">10:42:18</text><text x="294" y="246">claude-sonnet-4-5</text><text x="535" y="246">a91c33f2…</text><text x="695" y="246">2,846</text><text x="810" y="246">2,711</text><text x="1010" y="246" fill="#3fb950">ok</text><text x="78" y="315">10:43:02</text><text x="294" y="315">claude-sonnet-4-5</text><text x="535" y="315">a91c33f2…</text><text x="695" y="315">2,907</text><text x="810" y="315">1,024</text><text x="1010" y="315" fill="#f85149" font-weight="700">below expected</text></g>
  <text x="55" y="415" fill="#e6edf3" font-family="ui-monospace,monospace" font-size="17" font-weight="700">Character diff</text>
  <text x="55" y="443" fill="#8d9bad" font-family="ui-monospace,monospace" font-size="13">parent 70dba5b2 · divergence 1834 · estimated miss 434 tokens</text>
  <rect x="55" y="469" width="1090" height="110" rx="10" fill="#151b25" stroke="#263041"/>
  <text x="78" y="510" fill="#e6edf3" font-family="ui-monospace,monospace" font-size="16">Please summarize the customer feedback in a </text>
  <rect x="496" y="486" width="109" height="34" rx="3" fill="#5a1e23"/><text x="505" y="510" fill="#ffdcd7" font-family="ui-monospace,monospace" font-size="16" text-decoration="line-through">short list</text>
  <rect x="613" y="486" width="162" height="34" rx="3" fill="#174525"/><text x="622" y="510" fill="#aff5b4" font-family="ui-monospace,monospace" font-size="16">table by theme</text>
  <text x="78" y="552" fill="#e6edf3" font-family="ui-monospace,monospace" font-size="16">and include the strongest supporting quote.</text>
</svg>
