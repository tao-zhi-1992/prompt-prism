<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prompt Prism</title>
  <style>
    :root{color-scheme:dark;--bg:#0c1017;--panel:#151b25;--line:#263041;--muted:#8d9bad;--text:#e6edf3;--green:#3fb950;--red:#f85149}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,monospace}main{max-width:1180px;margin:auto;padding:40px 24px}h1{font-size:24px;margin:0 0 6px}.subtitle{color:var(--muted);margin-bottom:28px}.panel{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:#1b2431}.bad{color:var(--red);font-weight:700}.good{color:var(--green)}.empty{padding:42px;text-align:center;color:var(--muted)}dialog{width:min(1000px,92vw);max-height:85vh;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:0}dialog::backdrop{background:#000b}.dialog-head{position:sticky;top:0;background:var(--panel);display:flex;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line)}button{background:none;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 10px}.diff{white-space:pre-wrap;overflow-wrap:anywhere;padding:18px;line-height:1.7}.insert{background:#174525;color:#aff5b4}.delete{background:#5a1e23;color:#ffdcd7;text-decoration:line-through}.meta{color:var(--muted);padding:12px 18px 0}
  </style>
</head>
<body><main><h1>Prompt Prism</h1><div class="subtitle">See exactly where your prompt cache breaks.</div><section class="panel" id="logs"><div class="empty">Loading captures…</div></section></main><dialog id="detail"><div class="dialog-head"><strong>Character diff</strong><button id="close">Close</button></div><div class="meta" id="meta"></div><div class="diff" id="diff"></div></dialog><script type="module" src="/_pp/app.js"></script></body>
</html>
